<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Form pengajuan tiket">
    <title>Form Tiket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <div class="toolbar bg-light py-3">
        <div class="container text-center">
            <h1 class="text-dark fw-bold">Form Tiket</h1>
        </div>
    </div>

    <!-- Form Section -->
    <main class="container mt-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <form class="row g-3" id="ticketForm">
                    
                    <!-- Kategori Permasalahan -->
                    <div class="col-md-6">
                        <label for="category_id" class="form-label">Kategori Permasalahan</label>
                        <select id="category_id" class="form-select" required>
                            <option value="">Pilih Kategori</option>
                        </select>
                    </div>

                    <!-- Prioritas -->
                    <div class="col-md-6">
                        <label for="priority_id" class="form-label">Prioritas</label>
                        <select id="priority_id" class="form-select" required>
                            <option value="">Pilih Prioritas</option>
                        </select>
                    </div>

                    <!-- Regional -->
                    <div class="col-md-6">
                        <label for="regional_id" class="form-label">Regional</label>
                        <select class="form-select" id="regional_id" name="regional_id">
                            <option value="">Pilih Regional</option>
                        </select>
                    </div>
        
                    <!-- Provinsi -->
                    <div class="col-md-6">
                        <label for="province_id" class="form-label">Provinsi</label>
                        <select class="form-select" id="province_id" name="province_id">
                            <option value="">Pilih Provinsi</option>
                        </select>
                    </div>
        
                    <!-- Kabupaten -->
                    <div class="col-md-6">
                        <label for="kabupaten_id" class="form-label">Kabupaten</label>
                        <select class="form-select" id="kabupaten_id" name="kabupaten_id">
                            <option value="">Pilih Kabupaten</option>
                        </select>
                    </div>
        
                    <!-- Kecamatan -->
                    <div class="col-md-6">
                        <label for="kecamatan_id" class="form-label">Kecamatan</label>
                        <select class="form-select" id="kecamatan_id" name="kecamatan_id">
                            <option value="">Pilih Kecamatan</option>
                        </select>
                    </div>

                    <!-- Nomor HP -->
                    <div class="col-md-6">
                        <label for="no_hp" class="form-label">Nomor HP</label>
                        <input type="text" id="no_hp" class="form-control" placeholder="Masukkan nomor HP" required>
                        <small class="text-danger d-none" id="error_no_hp">Nomor HP tidak valid.</small>
                    </div>

                    <!-- Lampiran -->
                    <div class="col-md-6">
                        <label for="attachments" class="form-label">Lampiran (JPG, PNG)</label>
                        <input type="file" id="attachments" class="form-control" accept=".jpg, .jpeg, .png" required>
                        <small class="text-muted">Maksimal 2MB</small>
                        <small class="text-danger d-none" id="error_attachments">Format file tidak valid atau ukuran terlalu besar.</small>
                    </div>
                                        
                    <!-- Deskripsi Permasalahan -->
                    <div class="col-md-12">
                        <label for="description" class="form-label">Deskripsi Permasalahan</label>
                        <textarea id="description" class="form-control" rows="3" required></textarea>
                    </div>

                    <!-- Tombol Submit -->
                    <div class="col-md-12 text-center">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                </form>

                <!-- Pesan Respon -->
                <div id="responseMessage" class="mt-3 text-success d-none"></div>
            </div>
        </div>
    </main>

    <!-- Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Ambil data untuk dropdown
            fetchOptions('http://localhost:8000/api/kategori', 'category_id', 'category_name');
            fetchOptions('http://localhost:8000/api/priority', 'priority_id', 'priority_name');
            fetchOptions('http://localhost:8000/api/regional', 'regional_id', 'regional_name');

            document.getElementById('regional_id').addEventListener('change', function() {
                fetchOptions('http://localhost:8000/api/prov/' + this.value, 'province_id', 'name');
            });

            document.getElementById('province_id').addEventListener('change', function() {
                fetchOptions('http://localhost:8000/api/kab/' + this.value, 'kabupaten_id', 'name');
            });

            document.getElementById('kabupaten_id').addEventListener('change', function() {
                fetchOptions('http://localhost:8000/api/kec/' + this.value, 'kecamatan_id', 'name');
            });

            function fetchOptions(url, selectId, keyName) {
    fetch(url)
        .then(response => response.json())
        .then(data => {
            const selectElement = document.getElementById(selectId);
            selectElement.innerHTML = '<option value="">Pilih</option>';
            if (data.outData) {  // Pastikan mengambil dari "outData"
                data.outData.forEach(item => {
                    selectElement.innerHTML += `<option value="${item.id}">${item[keyName]}</option>`;
                });
            }
        })
        .catch(error => console.error('Error fetching:', error));
}

            document.getElementById('ticketForm').addEventListener('submit', function(event) {
                event.preventDefault();

                const category_id = document.getElementById('category_id').value;
                const kecamatan_id = document.getElementById('kecamatan_id').value;
                const priority_id = document.getElementById('priority_id').value;
                const no_hp = document.getElementById('no_hp').value;
                const description = document.getElementById('description').value;

                const phoneRegex = /^[0-9]{10,13}$/;
                if (!phoneRegex.test(no_hp)) {
                    document.getElementById('error_no_hp').classList.remove('d-none');
                    return;
                } else {
                    document.getElementById('error_no_hp').classList.add('d-none');
                }

                const formData = new FormData();
                formData.append('category_id', category_id);
                formData.append('kecamatan_id', kecamatan_id);
                formData.append('priority_id', priority_id);
                formData.append('no_hp', no_hp);
                formData.append('description', description);

                const attachments = document.getElementById('attachments').files[0];
                const allowedTypes = ['image/jpeg', 'image/png'];
                const maxSize = 2 * 1024 * 1024;

                if (attachments) {
                    if (!allowedTypes.includes(attachments.type) || attachments.size > maxSize) {
                        document.getElementById('error_attachments').classList.remove('d-none');
                        return;
                    } else {
                        document.getElementById('error_attachments').classList.add('d-none');
                        formData.append('attachments', attachments);
                    }
                }

                fetch('http://localhost:8000/api/store', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('responseMessage').textContent = data.message;
                    document.getElementById('responseMessage').classList.remove('d-none', 'text-danger');
                    document.getElementById('responseMessage').classList.add('text-success');
                    document.getElementById('ticketForm').reset();
                })
                .catch(error => console.error('Error:', error));
            });
        });
    </script>

</body>
</html>
