version: '4.3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_project_ticketing
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:nrUaaehAvVzTXmsCHs4aFY4ktjFepLVplpAgk/+Q9M0=
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=project_ticketing
      - DB_USERNAME=root
      - DB_PASSWORD=qwerty12
    volumes:
      - .:/var/www
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: db_project_ticketing
    environment:
      - MYSQL_ROOT_PASSWORD=qwerty12
      - MYSQL_DATABASE=project_ticketing
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
