version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    ports:
      - "9008:9008"
    volumes:
      - .:/var/www/html
      - ./laravel.env:/var/www/html/.env:ro
    depends_on:
    - db
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY:-base64:...}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-kemendagri}
      - DB_USERNAME=${DB_USERNAME:-pola}
      - DB_PASSWORD=${DB_PASSWORD:-pondoklabu}
    networks:
      - laravel_network

  db:
    image: mysql:8.0
    container_name: ticket_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kemendagri}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-pondoklabu}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pondoklabu}
      MYSQL_USER: ${DB_USERNAME:-pola}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel_network

volumes:
  dbdata:

networks:
  laravel_network:
    driver: bridge